        with:
          name: scan-${{ needs.select_scope.outputs.class_a }}-${{ steps.scan.outputs.classb }}-1
          path: artifacts/scan-${{ needs.select_scope.outputs.class_a }}-${{ steps.scan.outputs.classb }}-1.tar
